# Netlify build + hosting config for the Insider Index frontend (Vite + React).
# The app lives in frontend/; these values mirror the working dashboard settings
# so the build configuration is version-controlled.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: serve index.html for client-side routes so deep links
# (/director/:id, /watchlist) resolve instead of 404-ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
